        <use href="#step" x="69" /><use href="#step" x="92" /><use href="#step" x="115" />
        <use href="#step" x="138" /><use href="#step" x="161" /><use href="#step" x="184" />
        <use href="#step" x="207" /><use href="#step" x="230" /><use href="#step" x="253" />
