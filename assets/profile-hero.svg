        <use href="#step" x="69" y="35" /><use href="#step" x="92" y="35" /><use href="#step" x="115" y="35" />
        <use href="#step" x="138" y="35" /><use href="#step" x="161" y="35" /><use href="#step" x="184" y="35" />
        <use href="#step" x="207" y="35" /><use href="#step" x="230" y="35" /><use href="#step" x="253" y="35" />
        <use href="#step" x="276" y="35" />

        <use href="#step" x="0" y="70" /><use href="#step" x="23" y="70" /><use href="#step" x="46" y="70" />
        <use href="#step" x="69" y="70" /><use href="#step" x="92" y="70" /><use href="#step" x="115" y="70" />
        <use href="#step" x="138" y="70" /><use href="#step" x="161" y="70" /><use href="#step" x="184" y="70" />
        <use href="#step" x="207" y="70" /><use href="#step" x="230" y="70" /><use href="#step" x="253" y="70" />
        <use href="#step" x="276" y="70" />

        <use href="#step" x="0" y="105" /><use href="#step" x="23" y="105" /><use href="#step" x="46" y="105" />
        <use href="#step" x="69" y="105" /><use href="#step" x="92" y="105" /><use href="#step" x="115" y="105" />
        <use href="#step" x="138" y="105" /><use href="#step" x="161" y="105" /><use href="#step" x="184" y="105" />
        <use href="#step" x="207" y="105" /><use href="#step" x="230" y="105" /><use href="#step" x="253" y="105" />
        <use href="#step" x="276" y="105" />
      </g>

      <g class="accent">
        <use href="#step" x="0" /><use href="#step" x="46" /><use href="#step" x="115" />
        <use href="#step" x="161" /><use href="#step" x="230" />

        <use href="#step" x="23" y="35" /><use href="#step" x="69" y="35" />
        <use href="#step" x="138" y="35" /><use href="#step" x="207" y="35" /><use href="#step" x="253" y="35" />

        <use href="#step" x="0" y="70" /><use href="#step" x="23" y="70" />
