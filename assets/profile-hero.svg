<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" role="img" aria-labelledby="title desc">
  <title id="title">王宇豪的 GitHub 个人主页</title>
  <desc id="desc">以初音未来的青色和数字 39 为暗号，将系统、算法、人工智能与笔记排成四条学习音轨。</desc>

  <style>
    .canvas { fill: #f3f7f7; stroke: #cbd9d9; }
    .panel { fill: #e7eeee; }
    .ink { fill: #142022; }
    .muted { fill: #647579; }
    .faint { fill: #d5e0e0; }
    .accent { fill: #39c5bb; }
    .accent-soft { fill: #8cded7; }
    .accent-ink { fill: #176e69; }
    .grid { fill: none; stroke: #b8c9c9; }
    .cursor { stroke: #39c5bb; }
    .display {
      font-family: "Arial Narrow", "Roboto Condensed", "Avenir Next Condensed", sans-serif;
      font-weight: 800;
      letter-spacing: 1.5px;
    }
    .body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    }
    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      letter-spacing: 1px;
    }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #10191b; stroke: #2b3c3e; }
      .panel { fill: #182426; }
      .ink { fill: #edf7f6; }
      .muted { fill: #9bb0b2; }
      .faint { fill: #304244; }
      .accent-soft { fill: #277f79; }
      .accent-ink { fill: #73ddd4; }
      .grid { stroke: #3a4d4f; }
    }
  </style>

  <defs>
    <rect id="step" width="15" height="15" rx="3" />
  </defs>

  <rect class="canvas" x="1" y="1" width="958" height="290" rx="14" />
  <path class="accent" d="M1 15A14 14 0 0 1 15 1h5v290h-5a14 14 0 0 1-14-14Z" />

  <g transform="translate(58 50)">
    <g transform="translate(0 0)">
      <circle class="accent" cx="5" cy="-4" r="4" />
      <text class="mono accent-ink" x="18" y="0" font-size="11">HOWIDOBETTER / TRACK 039</text>
    </g>

    <text class="display ink" x="0" y="66" font-size="45">WANG YUHAO</text>
    <text class="body muted" x="1" y="99" font-size="16">王宇豪 · 学生开发者</text>

    <g transform="translate(0 132)">
      <path class="accent" d="M0 0h28v3H0z" />
      <text class="body ink" x="0" y="32" font-size="16">把课程做成项目，</text>
      <text class="body ink" x="0" y="59" font-size="16">把卡住的地方写成笔记。</text>
    </g>
  </g>

  <g transform="translate(496 42)">
    <rect class="panel" x="0" y="0" width="416" height="208" rx="10" />

    <text class="mono muted" x="20" y="27" font-size="10">LEARNING LOOP</text>
    <text class="mono accent-ink" x="365" y="27" font-size="10">039</text>
    <path class="grid" d="M20 40H396" />

    <g class="mono muted" font-size="9">
      <text x="20" y="68">SYSTEMS</text>
      <text x="20" y="103">ALGORITHMS</text>
      <text x="20" y="138">AI</text>
      <text x="20" y="173">NOTES</text>
    </g>

