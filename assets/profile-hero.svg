<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" role="img" aria-labelledby="title desc">
  <title id="title">王宇豪的 GitHub 个人主页</title>
  <desc id="desc">以初音未来的青色和数字 39 为暗号，将系统、算法、人工智能与笔记排成四个常驻标签页。</desc>

  <style>
    .canvas { fill: #f3f7f7; }
    .card { fill: rgba(255,255,255,.68); stroke: rgba(20,32,34,.07); }
    .ink { fill: #142022; }
    .muted { fill: #65787c; }
    .accent { fill: #39c5bb; }
    .accent-ink { fill: #176e69; }
    .hairline { stroke: rgba(20,32,34,.06); }
    .display {
      font-family: -apple-system, "SF Pro Display", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
      font-weight: 800;
      letter-spacing: -2px;
    }
    .body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: .2px;
    }
    .mono {
      font-family: "SF Mono", ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      letter-spacing: 1.2px;
    }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0f191b; }
      .card { fill: rgba(255,255,255,.045); stroke: rgba(237,247,246,.1); }
      .ink { fill: #edf7f6; }
      .muted { fill: #9db3b5; }
      .accent { fill: #3fd0c5; }
      .accent-ink { fill: #7fe2da; }
      .hairline { stroke: rgba(237,247,246,.08); }
    }
  </style>

  <rect class="canvas" x="1" y="1" width="958" height="290" rx="26" />

  <circle class="accent" cx="64" cy="48" r="4" />
  <text class="mono accent-ink" x="80" y="52" font-size="11">HOWIDOBETTER · 039</text>

  <text class="display ink" x="64" y="130" font-size="60">王宇豪</text>
  <text class="body muted" x="64" y="170" font-size="17">学生开发者 · Student Developer</text>

  <text class="body ink" x="64" y="224" font-size="16">把课程做成项目，</text>
  <text class="body ink" x="64" y="252" font-size="16">把卡住的地方写成笔记。</text>

  <rect class="card" x="512" y="36" width="384" height="220" rx="18" />

  <text class="mono muted" x="536" y="66" font-size="10">FOUR TABS</text>
  <text class="mono accent-ink" x="872" y="66" font-size="10" text-anchor="end">039</text>
  <path class="hairline" d="M536 78H872" />

  <circle class="accent" cx="542" cy="101" r="3.5" />
  <text class="mono ink" x="560" y="105" font-size="13">NOTES</text>
  <text class="body muted" x="676" y="105" font-size="12.5">学习笔记与踩坑记录</text>

  <circle class="accent" cx="542" cy="141" r="3.5" />
  <text class="mono ink" x="560" y="145" font-size="13">SYSTEMS</text>
  <text class="body muted" x="676" y="145" font-size="12.5">MIT 6.828 自学实验</text>

  <circle class="accent" cx="542" cy="181" r="3.5" />
  <text class="mono ink" x="560" y="185" font-size="13">ALGORITHMS</text>
