<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
  <title id="title">王宇豪的 GitHub 个人主页</title>
  <desc id="desc">移动版个人横幅，以初音未来的青色和数字 39 为暗号。</desc>

  <style>
    .canvas { fill: #f3f7f7; }
    .ink { fill: #142022; }
    .muted { fill: #65787c; }
    .accent { fill: #39c5bb; }
    .accent-ink { fill: #176e69; }
    .display {
      font-family: -apple-system, "SF Pro Display", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
      font-weight: 800;
      letter-spacing: -2px;
    }
    .body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: .2px;
    }
    .mono {
      font-family: "SF Mono", ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      letter-spacing: 1.2px;
    }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0f191b; }
      .ink { fill: #edf7f6; }
      .muted { fill: #9db3b5; }
      .accent { fill: #3fd0c5; }
      .accent-ink { fill: #7fe2da; }
    }
  </style>

  <rect class="canvas" x="1" y="1" width="638" height="388" rx="26" />

  <text class="mono" x="320" y="132" font-size="11" text-anchor="middle"><tspan class="accent" font-size="14">●</tspan><tspan class="accent-ink" dx="9">HOWIDOBETTER · 039</tspan></text>

  <text class="display ink" x="320" y="192" font-size="52" text-anchor="middle">王宇豪</text>
  <text class="body muted" x="320" y="234" font-size="17" text-anchor="middle">学生开发者 · Student Developer</text>

  <text class="body ink" x="320" y="280" font-size="16" text-anchor="middle">把课程做成项目，</text>
  <text class="body ink" x="320" y="308" font-size="16" text-anchor="middle">把卡住的地方写成笔记。</text>

  <text class="mono muted" x="320" y="330" font-size="9.5" text-anchor="middle">39 · 慢慢学，认真写。</text>
</svg>
